<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — 页面不存在</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    (function () {
      const saved = localStorage.getItem('theme');
      const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && dark)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <style>
    .not-found { text-align: center; padding: 120px 24px; }
    .not-found .code { font-size: 6rem; font-weight: 800; letter-spacing: -0.06em; color: var(--accent); line-height: 1; }
    .not-found h1 { font-size: 1.6rem; margin: 16px 0 8px; }
    .not-found p { color: var(--text-secondary); margin-bottom: 28px; }
  </style>
</head>
<body>
  <div class="not-found">
    <div class="code">404</div>
    <h1>页面走丢了</h1>
    <p>你访问的页面不存在或已被移动。</p>
    <a href="index.html" class="btn btn-primary">返回首页</a>
  </div>
</body>
</html>
