<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>博客后台管理</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="assets/css/admin.css">
  <script>
    (function () {
      const saved = localStorage.getItem('theme');
      const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && dark)) document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>
</head>
<body>
  <!-- 登录视图 -->
  <div id="login-view" class="login-wrap">
    <div class="login-card">
      <div class="login-logo">J<span>.</span></div>
      <h1 id="login-heading">博客后台管理</h1>
      <p class="login-sub" id="login-sub">设置一个专用密码，用它加密你的 GitHub 凭据</p>

      <div class="field">
        <label class="field-label" for="password-input">管理密码</label>
        <input type="password" id="password-input" class="input" placeholder="设置一个只有你知道的密码" autocomplete="off">
        <p class="hint" id="password-hint">密码不会被存储，仅用于加密/解密凭据。请牢记，忘记后无法找回。</p>
      </div>

      <div class="field" id="confirm-field">
        <label class="field-label" for="confirm-input">确认密码</label>
        <input type="password" id="confirm-input" class="input" placeholder="再次输入密码" autocomplete="off">
      </div>

      <div class="field" id="token-field">
        <label class="field-label" for="token-input">GitHub 个人访问令牌</label>
        <input type="password" id="token-input" class="input" placeholder="ghp_... 或 github_pat_..." autocomplete="off">
        <p class="hint">需要 <strong>Contents (读写)</strong> 权限。令牌会被<strong>加密</strong>后存于本地，源码中不含任何明文凭据。</p>
      </div>

      <button id="login-btn" class="btn btn-primary btn-block">设置密码并进入</button>
      <div id="login-error" class="alert alert-error" hidden></div>
      <div class="login-foot">
        <a href="index.html">← 返回博客</a>
        <a href="#" id="reset-cred-link" hidden>重置凭据</a>
        <a href="https://github.com/settings/personal-access-tokens" target="_blank" rel="noopener">如何获取令牌？</a>
      </div>
      <div class="crypto-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        AES-GCM 加密 · PBKDF2 密钥派生 · 源码零明文
      </div>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="admin-view" class="admin-app" hidden>
    <aside class="sidebar">
      <div class="sidebar-brand">J<span>.</span> <em>管理后台</em></div>
      <nav class="side-nav">
        <button class="side-link active" data-view="site">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          站点设置
        </button>
        <button class="side-link" data-view="categories">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          分类管理
        </button>
        <button class="side-link" data-view="posts">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
          文章管理
        </button>
      </nav>
      <div class="sidebar-bottom">
        <button id="theme-toggle" class="side-link" title="切换主题">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          切换主题
        </button>
        <a class="side-link" href="index.html" target="_blank">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6M10 14L21 3"/></svg>
          查看博客
        </a>
        <button id="logout-btn" class="side-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
          退出登录
        </button>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-topbar">
        <div>
          <h2 id="view-title">站点设置</h2>
          <p id="view-subtitle">管理博客的基本信息与页脚内容</p>
        </div>
        <div class="topbar-actions">
          <span id="save-status" class="save-status"></span>
          <button id="save-btn" class="btn btn-primary">保存更改</button>
        </div>
      </header>
      <div id="view-container" class="view-container"></div>
    </main>
  </div>

  <!-- 编辑文章弹窗 -->
  <div id="editor-modal" class="modal" hidden>
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 id="editor-title">编辑文章</h3>
        <button class="modal-close" id="editor-close">&times;</button>
      </div>
      <div class="modal-body" id="editor-body"></div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="editor-cancel">取消</button>
        <button class="btn btn-primary" id="editor-save">保存文章</button>
      </div>
    </div>
  </div>

  <!-- 提示条 -->
  <div id="toast" class="toast" hidden></div>

  <script src="assets/js/admin.js"></script>
</body>
</html>
